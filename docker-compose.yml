services:
  db:
    image: postgres:17-alpine
    container_name: online-store-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: online_store
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d online_store"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - online_store_demo_data:/var/lib/postgresql/data

volumes:
  online_store_demo_data:
